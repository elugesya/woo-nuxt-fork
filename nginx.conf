server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml image/svg+xml;

    # Static assets cache (1 year)
    location ~* ^/_nuxt/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images cache
    location ~* ^/images/.+\.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Icons cache
    location ~* ^/icons/.+\.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Sitemap
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    # API routes (if any) - no cache
    location /api/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # HTML pages - no cache, must revalidate
    location / {
        # Try exact file, then without .html, then with .html, then directory index, finally fallback to index.html
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Tosla 3D Secure callback: convert POST to GET so SPA can handle it
    # Tosla posts back to /odeme/callback with query params (?order_id=...&key=...)
    # Since we serve a static SPA, there is no server handler for POST; redirect to GET preserving args
    location = /odeme/callback {
        if ($request_method = POST) {
            return 303 /odeme/callback?$args;
        }
        try_files $uri $uri.html $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # 404 handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 500 error handling
    error_page 500 502 503 504 /200.html;
    location = /200.html {
        internal;
    }
}
