fragment LineItemProduct on Product {
  name
  slug
  image {
    sourceUrl(size: THUMBNAIL)
    srcSet(size: LARGE)
    sizes
    altText
    title
  }
}
fragment LineItemVariation on ProductVariation {
  name
  image {
    sourceUrl(size: THUMBNAIL)
    srcSet(size: LARGE)
    sizes
    altText
    title
  }
}
fragment LineItem on LineItem {
  quantity
  total
  id
  product {
    node {
      ...LineItemProduct
    }
  }
  variation {
    node {
      ...LineItemVariation
    }
  }
}
