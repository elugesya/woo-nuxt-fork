query getPosts($first: Int = 12, $after: String) {
  posts(first: $first, after: $after, where: { status: PUBLISH, orderby: { field: DATE, order: DESC } }) {
    pageInfo {
      hasNextPage
      endCursor
      hasPreviousPage
      startCursor
    }
    nodes {
      id
      databaseId
      title
      slug
      excerpt
      date
      modified
      featuredImage {
        node {
          sourceUrl(size: LARGE)
          altText
          title
        }
      }
      author {
        node {
          name
          avatar {
            url
          }
        }
      }
      categories {
        nodes {
          id
          name
          slug
        }
      }
    }
  }
}
